# sub2api-cursor-sidecar model configuration
#
# Only applies to requests coming from Cursor (User-Agent contains "Cursor/").
# All other traffic is reverse-proxied to sub2api untouched.
#
# Each key is the model name Cursor sends (add it as a custom model in Cursor).
# Every model has exactly one reasoning effort:
#   target            upstream model sent to sub2api (optional, defaults to the key)
#   reasoning_effort  required: none | minimal | low | medium | high | xhigh
#
# The configured effort overrides any effort carried by the request
# (reasoning / reasoning_effort). Models not listed here keep the request's
# effort, if any.
models:
  gpt-5.5:        { reasoning_effort: medium }
  gpt-5.5-low:    { target: gpt-5.5, reasoning_effort: low }
  gpt-5.5-high:   { target: gpt-5.5, reasoning_effort: high }
  gpt-5.5-xhigh:  { target: gpt-5.5, reasoning_effort: xhigh }

  gpt-5.4:        { reasoning_effort: medium }
  gpt-5.4-low:    { target: gpt-5.4, reasoning_effort: low }
  gpt-5.4-high:   { target: gpt-5.4, reasoning_effort: high }
  gpt-5.4-xhigh:  { target: gpt-5.4, reasoning_effort: xhigh }

  gpt-5.4-mini:   { reasoning_effort: medium }

  gpt-5.3-codex:        { reasoning_effort: medium }
  gpt-5.3-codex-high:   { target: gpt-5.3-codex, reasoning_effort: high }
  gpt-5.3-codex-xhigh:  { target: gpt-5.3-codex, reasoning_effort: xhigh }
