# nginx -> sub2api-cursor-sidecar -> sub2api
#
# Replace the existing `proxy_pass http://<sub2api>` of your sub2api site with
# the sidecar. All paths (API, sub2api web UI, websockets) go through the
# sidecar; only Cursor chat/responses requests are rewritten.

map $http_upgrade $sidecar_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream sub2api_cursor_sidecar {
    server 127.0.0.1:8090;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass http://sub2api_cursor_sidecar;
        proxy_http_version 1.1;

        # The sidecar detects Cursor by User-Agent (nginx forwards it by default).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sidecar_connection_upgrade;

        # SSE streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
